<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування кандидата</title>
</head>

<body class="container-fluid">
    <div class="container-fluid" style="margin-top: 61px;">

        <!-- Navigatio section start -->
        <nav class="navbar navbar-dark bg-dark fixed-top">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar"
                    aria-labelledby="offcanvasDarkNavbarLabel">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">Меню</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                            aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body">
                        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="/">Головна сторінка</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="/candidats/new">Нові звернення</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="/candidats/old">Старі звернення</a>
                            </li>
                            <!-- Handle only for admin -->
                            <li class="nav-item">
                                <a class="nav-link active" href="/users">Користувачі</a>
                            </li>
                            <!-- Handle only for admin -->
                        </ul>
                    </div>
                    <div class="container text-center p-2" style="background-color: green;">
                        <div class="row align-items-end">
                            <div class="col">
                                <li class="row align-items-end">
                                    <a class="nav-link active" href="/logout">Вхід</a>
                                </li>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <!-- Navigation section end -->

        <!-- Candidats cards-->
        <div class="container mt-5" style="background-color: #f1eeee;">
            <h1 class="mb-4">Редагування кандидата</h1>

            <form th:action="@{/candidats/edit/{id}(id=${candidatEntity.id})}" th:object="${candidatEntity}" method="post">
                <input type="hidden" th:field="*{id}" />

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Ім'я</label>
                    <input id="name" type="text" class="form-control" th:field="*{name}" required />
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phoneNumber">Номер телефону</label>
                    <input id="phoneNumber" type="text" class="form-control" th:field="*{phoneNumber}" required />
                </div>

                <!-- Age -->
                <div class="form-group">
                    <label for="age">Вік</label>
                    <input id="age" type="number" class="form-control" th:field="*{age}" required />
                </div>

                <!-- Profession -->
                <div class="form-group">
                    <label for="profession">Фах</label>
                    <input id="profession" type="text" class="form-control" th:field="*{profession}" />
                </div>

                <!-- Health Status -->
                <div class="form-group">
                    <label for="helthStatus">Стан здоров'я</label>
                    <input id="helthStatus" type="text" class="form-control" th:field="*{helthStatus}" />
                </div>

                <!-- Comment -->
                <div class="form-group">
                    <label for="comment">Коментар</label>
                    <textarea id="comment" class="form-control" th:field="*{comment}"></textarea>
                </div>

                <!-- Submit Button -->
                <div class="container-fluid" style="margin: 10px; margin-left: 0px; padding-left: 0px;">
                    <button type="submit" class="btn btn-success">Зберігти зміни</button>
                    <a class="btn btn-danger" th:href="@{/candidats/{id}(id=*{id})}">Скасувати</a>
                </div>
                
            </form>
        </div>

        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
