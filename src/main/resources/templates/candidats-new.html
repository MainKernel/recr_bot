<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нові кандидати</title>
</head>

<body class="container-fluid">
    <div class="container-fluid" style="margin-top: 61px;">

        <!-- Navigatio section start -->
        <nav class="navbar navbar-dark bg-dark fixed-top">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar"
                    aria-labelledby="offcanvasDarkNavbarLabel">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">Меню</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                            aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body">
                        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="/">Головна сторінка</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="/candidats/new">Нові звернення</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="/candidats/old">Старі звернення</a>
                            </li>
                            <!-- Handle only for admin -->
                            <li class="nav-item">
                                <a class="nav-link active" href="/users">Користувачі</a>
                            </li>
                            <!-- Handle only for admin -->
                        </ul>
                    </div>
                    <div class="container text-center p-2" style="background-color: green;">
                        <div class="row align-items-end">
                            <div class="col">
                                <li class="row align-items-end">
                                    <a class="nav-link active" href="/logout">Вхід</a>
                                </li>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <!-- Navigation section end -->

        <!-- Candidats cards-->
        <div class="container mt-5">
            <h1 style="background-color: #f1eeee ; text-align: center;">Нові кандидати</h1>
            <div class="row g-3">
                <!-- Iterate through the candidates -->
                <div class="col-md-4" th:each="candidate : ${candidates}">
                    <div class="card d-flex flex-column justify-content-between" style="width: 100%; height: 240px;">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${candidate.name}">Ім'я кандидата</h5>
                            <p class="card-text">
                                Вік: <span th:text="${candidate.age}"></span><br>
                                Статус: <span th:text="${candidate.status}"></span><br>
                                Спеціальність: <span th:text="${candidate.profession}"></span><br>
                                Спроба: <span th:text="${candidate.atempt}"></span>
                            </p>
                        </div>
                        <a class="btn btn-primary w-100" th:href="@{/candidats/{id}(id=${candidate.id})}">Переглянути профіль</a>
                    </div>
                </div>
            </div>
        </div>
        
            <!-- Candidats cards-->

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
                crossorigin="anonymous"></script>
</body>

</html>
