<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Головна сторінка</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <link rel="stylesheet" href="css/index.css">
</head>

<body class="container-fluid" style="height: 80vh;">
  <!-- Navigation -->
  <nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar"
        aria-controls="offcanvasDarkNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="offcanvas offcanvas-start text-bg-dark" id="offcanvasDarkNavbar">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title">Меню</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
            aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" href="/">Головна сторінка</a></li>
            <li class="nav-item"><a class="nav-link active" href="/candidats/new">Нові звернення</a></li>
            <li class="nav-item"><a class="nav-link active" href="/candidats/old">Старі звернення</a></li>
            <li class="nav-item"><a class="nav-link active" href="/users">Користувачі</a></li>
          </ul>
        </div>
        <div class="container text-center p-2 bg-success">
          <a class="nav-link active" href="/logout">Вхід</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container" style="margin-top: 75px;">
    <!-- Add News Button -->
    <button id="news-button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#exampleModal">Додати
      новину</button>

    <!-- Welcome Section -->
    <div class="row justify-content-center">
      <div class="col-8">
        <div class="p-4 bg-light rounded-3">
          <h1 class="display-5 fw-bold text-center">Вітаємо в системі!!!</h1>
          <p class="fs-4 text-center">Тут ви будете бачити актуальні новини.</p>
          <p class="fs-6 fw-lighter text-end">Система</p>
        </div>
      </div>
    </div>

    <!-- News Section -->
    <div class="row" style="margin-top: 10px;">
      <div class="col-4 d-flex align-items-stretch" th:each="news : ${news}">
        <div class="card mb-4" style="width: 100%;">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title" th:text="${news.title}"></h5>
            <p class="card-text" th:text="${news.text}"></p>
            <p class="card-text" th:text="${news.user}"></p>
            <p class="card-text mt-auto text-muted" th:text="${news.newsPublishTime}"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination -->

  </div>

  <!-- Modal for Adding News -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Новина</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form method="post" action="/add-news">
            <div class="mb-3">
              <label for="message-title" class="col-form-label">Титул</label>
              <input type="text" class="form-control" id="message-title" name="message-title">
            </div>
            <div class="mb-3">
              <label for="message-text" class="col-form-label">Зміст новини</label>
              <textarea class="form-control" id="message-text" name="message-text"></textarea>
            </div>
            <div class="modal-footer">
              <input class="btn btn-primary" type="submit" value="Опублікувати">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрити</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
</body>

</html>
