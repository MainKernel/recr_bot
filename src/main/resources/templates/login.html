<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
      <title>Вхід</title>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <meta name="description" content="">
      <meta name="author" content="">
      <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-/Y6pD6FV/Vv2HJnA6t+vslU6fwYXjCFtcEpHbNJ0lyAFsXTsjBbfaDjzALeQsN6M" crossorigin="anonymous">
      <link href="http://getbootstrap.com/docs/4.0/examples/signin/signin.css" rel="stylesheet" crossorigin="anonymous"/>
      <link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}" />
  </head>
  <body>
    <div class="container">
      <form class="form-signin" th:action="@{/login}" method="post">
        <h2 class="form-signin-heading">Авторизація</h2>
        <p th:if="${param.error}" class="error">Данні для входа не вірні</p>
        <p>
          <label for="username" class="sr-only">Ім'я користувача</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Ім'я користувача" required autofocus/>
        </p>
        <p>
          <label for="totp" class="sr-only">Домен</label>
          <input type="text" id="totp" name="totp" class="form-control" placeholder="Домен" required autofocus/>
        </p>
        <p>
          <label for="password" class="sr-only">Пароль</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Пароль" required autofocus/>
        </p>
        <button class="btn btn-lg btn-primary btn-block" type="submit">Увійти</button><br/>
        <p><a href="/index" th:href="@{/index}">Повернутися на головну сторінку</a></p>
      </form>
    </div>
  </body>
</html>
